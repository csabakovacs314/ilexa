# Brand-impersonation guard pair (installed to multimap.d/ so it survives
# multimap.conf re-renders). Zero-score on their own; the HU_BRAND_SPOOF
# composite in composites.conf issues the verdict. See the maps for the
# brand list and each brand's real domains.
hu_brand_name {
  type = "header";
  header = "From";
  map = "/etc/rspamd/local.d/maps.d/hu_brand_names.re";
  regexp = true;
  symbol = "HU_BRAND_NAME";
  description = "From display-name/address names a known Hungarian brand";
}
hu_brand_fromdom {
  type = "from";
  filter = "email:domain:tld";
  map = "/etc/rspamd/local.d/maps.d/hu_brand_domains.inc";
  symbol = "HU_BRAND_FROMDOM";
  description = "From-domain belongs to a known Hungarian brand";
}
