# OTX DNSBL zone served by the local rbldnsd-otx instance (127.0.0.1:530).
# postscreen queries otx.rbl as a weighted DNSBL (otx.rbl*2, threshold 3) so
# an OTX hit adds signal but never blocks inbound mail on its own.
# See: /usr/bin/otx-rbldnsd-sync.sh, memory firewalld-otx / otx-sa-uri.
server:
    # rbldnsd runs on loopback; allow unbound to query it.
    do-not-query-localhost: no
    # otx.rbl is an unsigned internal zone — skip DNSSEC validation for it.
    domain-insecure: "otx.rbl"

stub-zone:
    name: "otx.rbl"
    stub-addr: 127.0.0.1@530
    stub-prime: no
    stub-first: no
