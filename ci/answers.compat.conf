# answers.compat.conf — OS-compatibility test profile.
#
# For first-ever installs on a fresh, DISPOSABLE box of a target this toolkit
# claims to support. Unlike answers.ci.conf (a lab profile that disables OTX,
# FTS-Xapian, MTA-STS, autoconfig, metrics, IPv6 and all hardening, so a green
# run proves little about them), this turns ON everything that can run without
# external credentials or public DNS. The point is to exercise every module's
# package names, service names and paths on that OS.
#
#   ci/run-acceptance.sh ci/answers.compat.conf
#
# ─── EDIT THESE THREE, NOTHING ELSE IS REQUIRED ────────────────────────────
# The installer refuses the shipped placeholders, so an unedited copy stops
# with an explanation rather than producing a broken host. Any resolvable name
# works -- it does not need real MX records, because TLS_MODE below is
# selfsigned.
MAIL_FQDN=mail.example.com
PRIMARY_DOMAIN=example.com
ADMIN_EMAIL=postmaster@example.com
# ───────────────────────────────────────────────────────────────────────────

EXTRA_DOMAINS=
ADMIN_PASSWORD=
PFA_ADMIN_PASSWORD=
MAIL_STORE=/data/mail
TIMEZONE=UTC

# selfsigned, deliberately: Let's Encrypt needs public DNS pointing at the box
# and port 80 reachable. A throwaway compatibility box usually has neither, and
# a failed issuance would mask the OS problems this run exists to find. Test
# letsencrypt separately, once, on a box that does have DNS.
TLS_MODE=selfsigned
CERTBOT_METHOD=standalone

# ---- spam handling ---------------------------------------------------------
SPAM_ADD_HEADER=4
SPAM_REJECT=15
SPAM_REWRITE_SUBJECT=yes
SPAM_SUBJECT_TAG="{Spam?}"
MESSAGE_SIZE_LIMIT=52428800

# ---- the console and its dependants ---------------------------------------
ENABLE_ILEXA=yes
ILEXA_URL_PREFIX=/ilexa/
POSTFIXADMIN_URL=/postfixadmin/
# Exercises 57-archive: the archive mailbox, the always_bcc wiring, the
# archive_index schema and the retention job. Also the only way to test that a
# 20-postfix re-render preserves always_bcc.
ENABLE_ARCHIVE=yes
ARCHIVE_RETENTION_DAYS=30
SENDER_LOGIN_POLICY=warn

# ---- rspamd extras --------------------------------------------------------
ENABLE_MX_CHECK=yes
ENABLE_KNOWN_SENDERS=yes

# ---- dovecot extras ------------------------------------------------------
ENABLE_LAST_LOGIN=yes
ENABLE_SIEVE=yes
ENABLE_QUOTA=yes
# WATCH THIS ONE. On Debian/Ubuntu it is the dovecot-fts-xapian package, whose
# availability varies by release; on EL there is no package and 25-dovecot
# COMPILES it from source (dovecot-devel, xapian-core-devel, gcc-c++), which is
# slow and the most likely single point of failure on EL10. If a first run dies
# here, set this to no, confirm the rest of the stack is clean, then come back
# to it -- that isolates a package problem from a stack problem.
ENABLE_FTS_XAPIAN=yes

# ---- threat intel, only what works without credentials -------------------
# OTX and the feeds need API keys. Leaving them off is not a gap in coverage
# here: 70-otx/72-feeds mostly install scripts and cron entries, and their
# OS-specific parts (rbldnsd, unbound, ipset paths) are covered by 60-firewalld
# and 95-sources below. Test them on a box where you have keys.
ENABLE_OTX=no
ENABLE_OTX_URI=no
ENABLE_FEEDS=no

# Install rspamd even when its upstream GPG key cannot be verified on this
# platform (EL10 rejects rspamd.com's SHA-1 key). yes = gpgcheck off for the
# rspamd repo ONLY. Leave no unless you accept unverified packages.
RSPAMD_ALLOW_UNSIGNED=no
OTX_API_KEY=
ABUSECH_API_KEY=
ABUSEIPDB_API_KEY=
SPAMHAUS_DQS_KEY=
# Exercises 60-firewalld's ipset creation and the incremental rich-rule logic
# rewritten on 2026-08-17, plus 95-sources running a real updater at install.
GEOBLOCK_COUNTRIES="cn"

# ---- ClamAV --------------------------------------------------------------
# The unofficial-sigs script pulls a large signature set and is slow, but it is
# also where clamd's memory ceiling gets tested. Leave on; if a box is small,
# this is the first thing to turn off.
ENABLE_UNOFFICIAL_SIGS=yes

# ---- DNS-adjacent modules -------------------------------------------------
# These write config and DNS notes rather than needing working DNS, so they are
# safe to exercise on a box with no public records.
ENABLE_MTA_STS=yes
MTA_STS_MODE=testing
TLSRPT_RUA=
ENABLE_AUTOCONFIG=yes
ENABLE_IPV6=no

# ---- observability -------------------------------------------------------
# node_exporter's package and service names differ between families, which is
# exactly the kind of thing this profile exists to catch.
ENABLE_METRICS=yes
METRICS_SCRAPE_CIDR=127.0.0.1/32

# ---- hardening -----------------------------------------------------------
# SSH key-only is OFF on purpose: it is the one setting that can lock you out
# of a box you still need to debug. 85-hardening already refuses it when
# ADMIN_SSH_PUBKEY is empty, but do not rely on that here.
HARDEN_SSH_KEYONLY=no
ADMIN_SSH_PUBKEY=
SSH_PORT=22
# Exercises the SELinux path on EL (a no-op on Debian, where 85-hardening
# switches to AppArmor). Permissive burn-in, never enforcing on a first run.
HARDEN_SELINUX=yes
HARDEN_WEBMIN=no
WEBMIN_PORT=10000
WEBMIN_ALLOW_IPS=127.0.0.1
HARDEN_SMTP_TUNING=yes
# Reboots a box mid-test if a kernel update lands. Off.
HARDEN_KERNEL_AUTOREBOOT=no
# unattended-upgrades on Debian, dnf-automatic on EL — different packages,
# different unit names, worth covering.
ENABLE_UNATTENDED=yes

BACKUP_TARGET=
BACKUP_PASSPHRASE=
