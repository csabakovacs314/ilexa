# answers.ci.conf — unattended values for the CI/VM acceptance run.
# Lab-only: self-signed TLS, threat-intel/DNS-dependent features off.
MAIL_FQDN=mail.ci.test
MAIL_HOSTNAME=mail
PRIMARY_DOMAIN=ci.test
EXTRA_DOMAINS=
ADMIN_EMAIL=postmaster@ci.test
ADMIN_PASSWORD=ci-admin-pw-CHANGEME
MAIL_STORE=/data/mail
TLS_MODE=selfsigned
SPAM_REJECT=15
GEOBLOCK_COUNTRIES="ru cn"
SSH_PORT=22
ENABLE_OTX=no
ENABLE_LAST_LOGIN=yes
ENABLE_FTS_XAPIAN=no
ENABLE_UNATTENDED=no
ENABLE_MTA_STS=no
ENABLE_IPV6=no
ENABLE_SIEVE=yes
ENABLE_QUOTA=yes
ENABLE_AUTOCONFIG=no
ENABLE_METRICS=no
HARDEN_SSH_KEYONLY=no
HARDEN_SELINUX=no
HARDEN_WEBMIN=no
HARDEN_KERNEL_AUTOREBOOT=no
HARDEN_SMTP_TUNING=yes
