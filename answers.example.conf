# answers.example.conf — mail-deploy unattended answer file.
# Copy to answers.conf and edit, then: ./deploy.sh --answers answers.conf
# The interactive whiptail wizard collects these same keys.
# Every value here is a SAFE EXAMPLE / lab default — no live secrets.

# ---- identity --------------------------------------------------------------
MAIL_FQDN=mail.example.com          # public FQDN of this mail server (MX target, TLS CN)
MAIL_HOSTNAME=mail                  # short hostname
PRIMARY_DOMAIN=example.com          # primary virtual mail domain
EXTRA_DOMAINS=                      # space-separated additional virtual domains, or empty

# ---- admin -----------------------------------------------------------------
ADMIN_EMAIL=postmaster@example.com  # PostfixAdmin superadmin login + alerts destination
ADMIN_PASSWORD=                     # PostfixAdmin superadmin password; empty => auto-generated
# A SECOND PostfixAdmin superadmin, postfixadmin@<MAIL_FQDN>, is always created
# so the panel has a login separate from the postmaster mailbox identity. It is
# a login only -- no mailbox is created and no mail is delivered to it. Leave
# blank to auto-generate; the value is persisted, so re-runs will not rotate it.
PFA_ADMIN_PASSWORD=                 # postfixadmin@<fqdn> password; empty => auto-generated

# ---- storage / TLS ---------------------------------------------------------
MAIL_STORE=/data/mail               # Maildir root: <store>/<domain>/<user@domain>/
# IANA timezone applied to the HOST (timedatectl) and to the console's display.
# Drives mail-log timestamps, cron and MariaDB too, so console and logs agree.
# Leave unset to keep whatever the host is already using.
TIMEZONE=Europe/Budapest
TLS_MODE=letsencrypt                # letsencrypt | custom | selfsigned
CERTBOT_METHOD=webroot              # webroot | standalone (letsencrypt only). webroot is the default:
                                    # standalone binds :80 itself and the web server already holds it.
# TLS_MODE=custom: install a certificate you already hold -- commercial,
# wildcard, or from an internal CA. Both paths are required and are validated
# BEFORE anything is installed: the key must match the certificate, the
# certificate must not be expired and must cover MAIL_FQDN. A failure here
# aborts the run rather than quietly falling back to self-signed.
# The certificate file should carry the full chain, server certificate first,
# then intermediates. Renewal is yours to handle in this mode -- nothing here
# automates it (letsencrypt mode arms certbot.timer and a reload hook).
# The key must NOT be passphrase-protected: services start unattended.
TLS_CUSTOM_CERT=                    # e.g. /root/certs/mail.example.com.fullchain.pem
TLS_CUSTOM_KEY=                     # e.g. /root/certs/mail.example.com.key
# selfsigned is a LAB/ FALLBACK mode only: no mail client or browser accepts
# such a certificate, so it exists for boxes with no public DNS yet, and as the
# automatic fallback when Let's Encrypt cannot issue.

# ---- database --------------------------------------------------------------
# DB passwords are ALWAYS auto-generated to /root/mail-deploy-credentials.txt.
# (No password fields here on purpose — secrets-free answer file.)

# ---- filtering / firewall --------------------------------------------------
# --- scanner (rspamd) -------------------------------------------------------
SPAM_ADD_HEADER=4                   # score at which mail is tagged as spam
SPAM_REWRITE_SUBJECT=6              # score at which the subject gets the tag
SPAM_REJECT=15                      # safety-net reject; also arms the virus reject
SPAM_SUBJECT_TAG={Spam?}            # subject prefix for tagged mail
# --- ilexa console ----------------------------------------------------------
ENABLE_ILEXA=yes

# --- reputation feeds -------------------------------------------------------
# All updaters are installed regardless. A source whose key is blank is left
# DISABLED and can be enabled later from ilexa -> Admin -> feed sources.
# --- central mail archive ---------------------------------------------------
# ---- deployment type: with or without the central mail archive --------------
# Copies EVERY message of EVERY user (Postfix always_bcc) into one
# admin-readable mailbox. Filtering works identically either way; what the
# archive adds is recovery, retrospective search and training signal.
#
# Why it exists, since "archive everything" needs justifying:
#   * POP3 clients DELETE mail from the server after download, so once a user
#     has collected their mail there is no server-side copy to examine,
#     recover or learn from. IMAP users emptying folders leave the same hole.
#   * Users do not reliably report spam, so without an archive the training
#     corpus is only what a few people bother to forward to spam@/ham@.
#   * There is NO quarantine in this design -- suspect mail is tagged and
#     delivered -- so the archive is the only place a false positive can be
#     retrieved from, including mail scored down for a dangerous attachment.
#   * The Archive tab, search, spam/ham training buttons and weekly digest all
#     read from it; without it those features have no data.
#
# GDPR / privacy: this is the content of everyone's mail, inbound and outbound,
# in one mailbox administrators can read. In most jurisdictions that is
# personal-data processing requiring a lawful basis, a defined retention period
# and users informed in advance. ARCHIVE_RETENTION_DAYS is enforced by a daily
# job. The console also has a content-viewing policy (Rendszer -> adatvedelem)
# that can restrict or forbid reading bodies even for admins; it defaults to
# DENY, so enabling the archive does not by itself grant anyone read access.
ENABLE_ARCHIVE=no
ARCHIVE_RETENTION_DAYS=30

ENABLE_FEEDS=no
ABUSECH_API_KEY=                    # abuse.ch: URLhaus + ThreatFox/Feodo C2
ABUSEIPDB_API_KEY=
ENABLE_SIEM_EXPORT=no                # yes|no — prep rsyslog to pull Fail2Ban/Apache-SSL-errors/ilexa-audit into local2-4; forwarding itself ships commented out until a real collector is set (see 66-siem-export.sh)
ENABLE_OTX_URI=no                   # OTX URI feed -> rspamd url multimap (symbol FEED_OTX_URI)
GEOBLOCK_COUNTRIES="ru cn br kr"    # firewalld geoblock country codes (space-separated); one-time seed only, later edits go through the ilexa console
SSH_PORT=22                         # SSH port to open in firewalld (change if non-default)
WEBMIN_PORT=10000                   # Webmin port to open (only relevant if Webmin installed)

# ---- OTX threat-intel ------------------------------------------------------
ENABLE_OTX=yes                      # yes|no — AlienVault OTX suite (IP block + URI-SA + rbldnsd)
OTX_API_KEY=                        # your OTX key; empty + ENABLE_OTX=yes => prompt at runtime
OTX_TRUSTED_CIDRS=                  # extra never-block CIDRs (CF/Google are bootstrapped already)

# ---- Language-based spam-classifier module (experimental) ------------------
# Installs a shadow-mode rspamd add-on for Hungarian AND English (fastText
# language ID + a per-language Wikipedia-trigram naturalness score, all
# logged with score=0.0, no effect on verdicts) plus a small local Python
# service it calls. HU_SPAM/HU_PHISHING/HU_SCAM are fixed placeholders, not
# trained models -- see assets/hu-classify/hu-classify-stub.py for why (no
# English equivalent attempted). Installing this does NOT turn it on: even
# with ENABLE_HU_CLASSIFY=yes the module ships inert until an admin flips it
# on from the console's Rendszer page (instant, no rspamd reload) -- which
# also then shows how many days into the ~2-week observation window it is,
# since the shadow-mode signals need real traffic before it makes sense to
# judge whether any of them deserve a real weight. Adds ~2MB of bundled
# model assets and a dedicated Python venv under /opt/hu-classify; needs a C
# toolchain (installed automatically) to build the fastText dependency on
# hosts with no matching PyPI wheel.
ENABLE_HU_CLASSIFY=no
# Where the fortnightly signal-review report is emailed. The job re-measures
# the (weight-0) language signals against mail the model has not seen and
# mails a recommendation on whether any of them has earned a real score --
# it never changes a weight itself. Left empty, the console's Rendszer page
# can set it later, and with nothing set there it falls back to the general
# alert address (/etc/ilexa/alerts.conf); with neither, no report is sent.
# Seeded once only -- the console owns this setting after the first install.
HU_CLASSIFY_REPORT_EMAIL=

# ---- Spamhaus DQS (Data Query Service) --------------------------------------
# Optional. Routes Spamhaus RBL lookups (zen replacement) and Spamhaus ZRD
# (Zero Reputation Domains -- flags newly-registered domains, a phishing
# signal) through your own DQS account key instead of the increasingly
# rate-limited free public zones. Free at low query volumes; register at
# spamhaus.org. Leave empty to skip both -- rspamd still runs its other RBL
# checks (public Spamhaus zones included) with no DQS account at all.
# Abusix Mail Intelligence DNS datafeed key. NOTE: the key alone is not enough --
# this server's public IP must ALSO be allowlisted in the Abusix portal, per
# host, or every lookup returns nothing and the feed is silently inert. Manage
# the key later from the console (Rendszer -> blocklist sources).
ABUSIX_API_KEY=
SPAMHAUS_DQS_KEY=

# ---- rspamd extras -----------------------------------------------------
# Sender MX validation: probes the envelope-from domain's mail exchanger.
# Scoring uses rspamd's own built-in per-symbol defaults (MX_NONE, MX_NULL,
# MX_BROKEN etc.) -- do not add local.d/groups.conf overrides without a
# specific reason, they are already well-tuned. Needs outbound TCP:25 to be
# useful; if blocked, this simply contributes nothing (fails open).
ENABLE_MX_CHECK=yes
# Per-sender reputation for freemail domains (gmail.com, outlook.com, etc.),
# where domain-level reputation is meaningless. Needs accumulated history
# to have any effect -- expect zero symbol hits for the first while.
ENABLE_KNOWN_SENDERS=yes

# ---- optional extras -------------------------------------------------------
ENABLE_LAST_LOGIN=yes               # Dovecot last_login dict plugin
ENABLE_FTS_XAPIAN=yes               # Dovecot fts_xapian full-text search (compiled; RAM-heavy)
# Weekly compaction of those indexes. Xapian indexes are written incrementally
# as mail arrives, which fragments them -- deleted mail leaves dead entries and
# the on-disk size grows well past the live data, making search progressively
# slower. Nothing compacts them by itself.
#
# The installed job is deliberately NOT `doveadm fts optimize -A`: compaction
# peak memory scales with index size, and doing every user in one pass on a
# mail-sized box reliably triggers the OOM killer. It caps each call with
# ulimit -v, skips indexes too large to succeed under the cap, runs nice/ionice
# idle, and derives its limits from this host's RAM at run time.
#
# Switchable afterwards from the console without reinstalling: the weekly cron
# stays and the job self-gates on FTS_OPTIMIZE_ENABLED in
# /etc/ilexa/fts-optimize.conf.
ENABLE_FTS_OPTIMIZE=yes
ENABLE_UNATTENDED=yes               # dnf-automatic security-only updates (excludes dovecot*)
# Third-party ClamAV signature sources (Sanesecurity, SecuriteInfo, URLhaus...)
# and YARA rules, via the EPEL clamav-unofficial-sigs package. Required by the
# ilexa console's ClamAV signature/YARA panel -- without it those toggles have
# no config file to edit. EL only: Debian/Ubuntu do not package it, so this key
# is ignored there (see modules/35-clamav.sh).
ENABLE_UNOFFICIAL_SIGS=yes

# ---- inbound TLS reputation (MTA-STS / TLS-RPT / DANE) ----------------------
ENABLE_MTA_STS=yes                  # publish an MTA-STS policy + generate TLS-RPT/TLSA records
MTA_STS_MODE=enforce                # enforce | testing | none
TLSRPT_RUA=                         # TLS report rua mailbox (blank => ADMIN_EMAIL)

# ---- IPv6 ------------------------------------------------------------------
ENABLE_IPV6=no                      # yes => Postfix inet_protocols=all + ::1 mynetworks (set AAAA + v6 PTR!)

# ---- webmail features ------------------------------------------------------
ENABLE_SIEVE=yes                    # server-side filters: dovecot-pigeonhole + ManageSieve (4190) + Roundcube plugin
ENABLE_QUOTA=yes                    # enforce PostfixAdmin per-mailbox quotas at SMTP time (Dovecot quota-status)
# spam@<domain> / ham@<domain> report addresses in every mail domain: users
# forward a mis-classified message AS AN ATTACHMENT; the handler learns it into
# rspamd (Bayes + local fuzzy) and saves spam reports into the reporter's own
# Spam folder (visible in the console). Existing spam@/ham@ mailboxes are never
# clobbered (INSERT IGNORE + warning). Main training path for POP3 users.
ENABLE_REPORT_ADDRESSES=yes
ENABLE_AUTOCONFIG=yes               # Thunderbird autoconfig + Outlook autodiscover endpoints (auto client setup)
                                    # NEEDS DNS: autoconfig.<domain> and autodiscover.<domain> as CNAMEs to
                                    # MAIL_FQDN. Clients fetch these over HTTPS, so the certificate has to
                                    # cover them too -- and on a first install it cannot, because the records
                                    # do not exist yet (this run prints them at the end). Names that do not
                                    # yet point at this host are SKIPPED from the certificate request rather
                                    # than failing the whole order; create the CNAMEs, then re-run
                                    #   ./deploy.sh --only 75-tls-dns --answers <file>
                                    # to add them. Same applies to mta-sts.<domain> when ENABLE_MTA_STS=yes.

# ---- hardening options (secure-by-default; see PLAN Part A) ----------------
HARDEN_SSH_KEYONLY=yes              # PermitRootLogin prohibit-password + no password auth + admin user
ADMIN_SSH_PUBKEY=                   # operator public key seeded into the sudo admin user (required if above=yes)
HARDEN_SELINUX=no                   # no => documented TODO (matches ref box); yes => permissive-burn-in then enforce
HARDEN_WEBMIN=yes                   # bind/allowlist Webmin
WEBMIN_ALLOW_IPS=127.0.0.1          # space-separated allowlist for Webmin (add your admin IP)
HARDEN_KERNEL_AUTOREBOOT=yes        # scheduled maintenance-window reboot instead of reboot=never drift
# Sender-identity guard: may an authenticated user put someone else's address
# in MAIL FROM? warn = log violations only (recommended first), enforce =
# reject them, off = no check at all. Start with warn, review
#   grep 'not owned by user' /var/log/maillog   (mail.log on Debian/Ubuntu)
# for a week, legitimise real delegations by adding the address to the
# sender's alias goto, then switch to enforce.
SENDER_LOGIN_POLICY=warn

HARDEN_SMTP_TUNING=yes              # message_size_limit 50M (smtpd_delay_reject is always yes now — not a tuning knob)
MESSAGE_SIZE_LIMIT=52428800         # 50 MiB (used when HARDEN_SMTP_TUNING=yes)

# ---- observability ---------------------------------------------------------
ENABLE_METRICS=no                   # Prometheus node_exporter (:9100)
METRICS_SCRAPE_CIDR=                # if set, open 9100 to this CIDR; else bind localhost only (SSH-tunnel)

# ---- backups (module always built; target parameterized/off by default) ----
BACKUP_TARGET=                      # empty => module installed but inactive; e.g. restic:s3:... / rsync target
BACKUP_PASSPHRASE=                  # set => gpg-encrypt DB dumps at rest (they contain password hashes)
